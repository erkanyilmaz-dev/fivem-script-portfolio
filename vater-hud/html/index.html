<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WraithPVP HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       1. PVP SEVİYE & XP KARTI (SOL ÜST)
  ════════════════════════════════════════════ -->
  <div id="rank-card" class="hud-card">
    <div class="rank-header">
      <span class="rank-title" id="rank-name">BRONZE</span>
      <span class="rank-level" id="rank-lvl">LVL 1</span>
    </div>
    <div class="xp-bar-bg">
      <div id="xp-bar-fill" style="width: 20%;"></div>
    </div>
    <div class="xp-info">
      <span class="xp-label">PVP XP</span>
      <span class="xp-value" id="xp-text">20 / 100</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       2. SAĞ ÜST KÖŞE: SAAT, LOGO, ISTATISTIKLER
  ════════════════════════════════════════════ -->
  <div id="hud-wrapper">
    <div id="hud-panel" class="hud-card">

      <!-- ── Sol Blok: Saat + Tarih ── -->
      <div class="hud-block hud-left">
        <div class="info-row">
          <span class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="info-value" id="hud-time">12:00 PM</span>
        </div>
        <div class="info-row">
          <span class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="info-value" id="hud-date">01/01/2026</span>
        </div>
      </div>

      <!-- ── Orta Blok: Logo ── -->
      <div class="hud-block hud-center">
        <div class="logo-wrapper">
          <img id="server-logo" src="logo.png" alt="WraithPVP Logo" />
          <div class="logo-glow"></div>
        </div>
      </div>

      <!-- ── Sağ Blok: Stats ── -->
      <div class="hud-block hud-right">
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">KILLS</span>
            <span class="stat-value" id="hud-kills">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">DEATHS</span>
            <span class="stat-value" id="hud-deaths">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item" id="streak-container">
            <span class="stat-label">STREAK</span>
            <span class="stat-value" id="hud-streak">0</span>
          </div>
        </div>
        <div class="server-info-row">
          <span class="server-name">WRAITHPVP</span>
          <span class="server-discord">discord.gg/wraithpvp</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       3. NEON CAN & ZIRH BARLARI (ALT ORTA)
  ════════════════════════════════════════════ -->
  <div id="status-card" class="hud-card">
    <!-- Can Barı -->
    <div class="status-row">
      <div class="status-icon health-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="bar-container">
        <div id="health-bar-fill" class="bar-fill animate-bar" style="width: 100%;">
          <div class="bar-glow"></div>
        </div>
      </div>
      <span class="status-value" id="health-val">100</span>
    </div>

    <!-- Zırh Barı -->
    <div class="status-row">
      <div class="status-icon armor-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6h7c-.47 4.14-2.88 7.82-7 9V7.1L5 7V12c0 3.32 1.83 6.38 5 7.6V7h2z"/>
        </svg>
      </div>
      <div class="bar-container">
        <div id="armor-bar-fill" class="bar-fill animate-bar" style="width: 50%;">
          <div class="bar-glow"></div>
        </div>
      </div>
      <span class="status-value" id="armor-val">50</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       4. BİLDİRİM AKIŞI (SAĞ ORTA)
  ════════════════════════════════════════════ -->
  <div id="notification-feed"></div>

  <!-- ═══════════════════════════════════════════
       5. TARAYICI ÖNİZLEME TEST PANELİ (SOL ALT)
  ════════════════════════════════════════════ -->
  <div id="preview-test-panel">
    <div class="panel-header">
      <span>🛠️ HUD TEST PANELİ</span>
      <button id="toggle-panel-btn">✕</button>
    </div>
    <div class="panel-body">
      <button class="test-btn" id="btn-add-kill">+1 Kill Ekle</button>
      <button class="test-btn" id="btn-add-xp">+20 XP Ekle</button>
      <button class="test-btn" id="btn-damage">Can & Zırh Düşür</button>
      <button class="test-btn" id="btn-heal">Full Can & Zırh</button>
      <button class="test-btn" id="btn-trigger-notif">Örnek Bildirim Gönder</button>
    </div>
  </div>

  <button id="open-panel-btn">🛠️</button>

  <script src="script.js"></script>
</body>
</html>
